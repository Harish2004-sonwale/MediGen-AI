# ==============================================================================
# MediGen AI - Production Docker Compose Reference Stack
# Multi-Tier Container Architecture: Ingress, Frontend, API, Worker, DB, Cache
# ==============================================================================

version: "3.8"

services:
  # 1. Edge Ingress Reverse Proxy & Load Balancer
  ingress:
    image: nginx:1.27-alpine
    container_name: medigen-ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - medigen-internal

  # 2. Frontend React SPA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medigen-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medigen-internal

  # 3. Backend FastAPI ASGI API Cluster
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medigen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_in_production_password}@postgres:5432/${POSTGRES_DB:-medigen_ai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CACHE_ENABLED: "True"
      RATE_LIMIT_ENABLED: "True"
      PROMETHEUS_METRICS_ENABLED: "True"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ASGI_WORKERS: ${ASGI_WORKERS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.medigen.ai}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      BACKGROUND_TASK_PROVIDER: local
      BACKGROUND_TASK_WORKERS: 4
      DRUG_KNOWLEDGE_PROVIDER: mock
    volumes:
      - medigen_data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - medigen-internal

  # 4. Asynchronous Background Task Worker (Celery Fleet)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medigen-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_in_production_password}@postgres:5432/${POSTGRES_DB:-medigen_ai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - medigen_data:/app/backend/data
    networks:
      - medigen-internal

  # 5. PostgreSQL 16 Clinical Database
  postgres:
    image: postgres:16-alpine
    container_name: medigen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_in_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-medigen_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medigen_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medigen-internal

  # 6. Redis 7 In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: medigen-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - medigen-internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  medigen_data:
    driver: local

networks:
  medigen-internal:
    driver: bridge
