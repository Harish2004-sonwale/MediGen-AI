name: MediGen AI - Enterprise Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI (Python 3.11, Pytest, Alembic, Security Scan)
  # ============================================================================
  backend-ci:
    name: Backend Validation & Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black bandit pip-audit

      - name: Check Code Formatting & Linting
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Alembic Database Migration SQL Validation
        run: |
          alembic upgrade head --sql

      - name: Run Pytest Integration & Safety Suite
        run: |
          pytest tests -v

      - name: Security & Dependency CVE Audit
        run: |
          bandit -r app -ll --exit-zero
          pip-audit --desc || true

  # ============================================================================
  # 2. Frontend CI (Node.js 20, TypeScript, Vitest, Vite Build)
  # ============================================================================
  frontend-ci:
    name: Frontend TypeScript, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Suite
        run: npx vitest run

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high || true

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-ci:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: medigen-api:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: medigen-frontend:ci-test
