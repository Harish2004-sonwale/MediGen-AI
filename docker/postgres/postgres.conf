# ==============================================================================
# MediGen AI - Production PostgreSQL 16 Configuration
# Enterprise Clinical Database Parameter Tuning & WAL Archiving
# ==============================================================================

# Connectivity & Connections
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory Allocation (Sized for 2GB - 8GB production server base)
shared_buffers = 256MB                  # 25% of baseline RAM
work_mem = 16MB                         # Sized for complex clinical joins & aggregations
maintenance_work_mem = 64MB             # Maintenance tasks (VACUUM, index rebuilds)
effective_cache_size = 768MB            # Estimated OS filesystem cache size
dynamic_shared_memory_type = posix

# Write-Ahead Logging (WAL) & Replication / PITR Readiness
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9      # Spread checkpoints smoothly over time
checkpoint_timeout = 15min
archive_mode = off                      # Enable when external WAL archive directory/S3 bucket is configured
# archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Query Planner & Cost Tuning (SSD / NVMe storage optimization)
random_page_cost = 1.1                  # Low seek cost for SSD drives
effective_io_concurrency = 200          # Concurrency for SSD prefetching

# Logging & Operational Observability
logging_collector = on
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log slow queries exceeding 250ms
log_line_prefix = '%m [%p] %q%u@%d '    # Timestamp [PID] user@db
log_timezone = 'UTC'

# Autovacuum Tuning (Prevent transaction ID wraparound and table bloat)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Locale & Formatting
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
