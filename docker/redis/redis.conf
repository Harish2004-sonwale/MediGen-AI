# ==============================================================================
# MediGen AI - Production Redis 7 Configuration
# Distributed Caching, Celery Task Broker & Rate Limiting Storage
# ==============================================================================

# Networking & Binding
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Server Settings
daemonize no
loglevel notice
databases 16

# Persistence Configuration (Append Only File for High Durability)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management (512MB RAM cap with LRU eviction for cache keys)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
