# ==============================================================================
# MediGen AI - Prometheus Monitoring Configuration
# Scrapes metrics from FastAPI ASGI API instances and Celery worker metrics
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # 1. MediGen AI Backend API Metrics
  - job_name: "medigen-api"
    metrics_path: "/api/v1/health/metrics/prometheus"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "medigen-api"
          tier: "application"

  # 2. Redis Exporter (if enabled)
  - job_name: "medigen-redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "medigen-redis"
          tier: "cache"

  # 3. PostgreSQL Database Exporter (if enabled)
  - job_name: "medigen-postgres"
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          service: "medigen-postgres"
          tier: "database"
