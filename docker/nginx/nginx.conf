# ==============================================================================
# MediGen AI - Edge Ingress Reverse Proxy & Load Balancer
# Hardened TLS 1.3, Rate Limiting, Security Headers & Upstream Routing
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with correlation and timing metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    # Rate Limiting Zones (Memory-backed sliding window)
    # 1. Strict authentication limiter: 5 requests per second per IP (burst=10)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # 2. General API rate limiter: 50 requests per second per IP (burst=100)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # 3. Connection limit: maximum 30 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstream backend API service (FastAPI ASGI Cluster)
    upstream backend_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream frontend UI service (React 18 SPA)
    upstream frontend_ui {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ==============================================================================
    # HTTP -> HTTPS Redirect Server Block (Production Ingress)
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck probe for external load balancers (AWS ALB / Cloudflare / K8s)
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME challenge for Let's Encrypt / Certbot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS (in production)
        location / {
            # In development/local compose, pass through if SSL is disabled
            # In production, redirect to https://$host$request_uri;
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route API requests when running on HTTP mode
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn addr_limit 30;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Dedicated Authentication rate limiting
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE Streaming endpoints (Chat & Live telemetry)
        location ~* /api/v1/(chat/sessions/[^/]+/stream|vitals/stream) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # Core health, readiness & documentation endpoints
        location ~* ^/(health|ready|docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ==============================================================================
    # HTTPS Production Server Block (TLS 1.3 Hardened)
    # ==============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL / TLS Certificate Configuration (Override via volume mount in prod)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # TLS Protocols & Cipher Suites (Strict TLS 1.3 and hardened TLS 1.2)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Client body limit for medical document & DICOM asset uploads (50MB)
        client_max_body_size 50M;

        # Root SPA Frontend Routing
        location / {
            proxy_pass http://frontend_ui;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API Gateway Routing
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn addr_limit 30;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Dedicated Authentication rate limiting
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # SSE Streaming endpoints (Chat & Live telemetry)
        location ~* /api/v1/(chat/sessions/[^/]+/stream|vitals/stream) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # Core health & documentation endpoints
        location ~* ^/(health|ready|docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
